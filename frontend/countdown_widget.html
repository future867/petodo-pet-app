<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petodo Countdown Widget</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      color-scheme: light;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      padding: 8px;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .widget-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 18px 18px 16px;
      border: 1px solid rgba(222, 220, 209, 0.96);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 254, 250, 0.98) 0%, rgba(252, 248, 242, 0.98) 100%);
      box-shadow: 0 6px 18px rgba(20, 20, 19, 0.06);
      -webkit-app-region: drag;
      box-sizing: border-box;
    }

    .widget-toolbar,
    .widget-body,
    .widget-actions {
      -webkit-app-region: no-drag;
    }

    .widget-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .widget-kicker,
    .widget-date,
    .widget-status,
    .widget-empty {
      margin: 0;
    }

    .widget-kicker {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .widget-close {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(222, 220, 209, 0.96);
      border-radius: 999px;
      color: var(--text-secondary);
      background: rgba(255, 254, 250, 0.98);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .widget-body {
      display: grid;
      align-content: start;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .widget-title {
      margin: 0;
      color: var(--text-main);
      font-size: 28px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .widget-date {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.35;
    }

    .widget-status {
      color: var(--accent);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .widget-status.is-today {
      color: #3b6c48;
    }

    .widget-status.is-completed {
      color: #6a6962;
    }

    .widget-empty {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.55;
    }

    .widget-actions {
      display: flex;
      justify-content: flex-start;
      margin-top: 14px;
    }

    .widget-refresh {
      min-height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 13px;
      background: rgba(243, 240, 232, 0.95);
    }
  </style>
</head>
<body>
  <main class="widget-shell" aria-label="未来倒计时桌面小组件">
    <div class="widget-toolbar">
      <p class="widget-kicker">Future Countdown</p>
      <button class="widget-close" id="widgetCloseButton" type="button" aria-label="关闭小组件">×</button>
    </div>

    <section class="widget-body">
      <h1 class="widget-title" id="widgetTitle">未来倒计时</h1>
      <p class="widget-date" id="widgetDate">--</p>
      <p class="widget-status" id="widgetStatus">还没有未来目标</p>
      <p class="widget-empty" id="widgetEmptyText" hidden>去主页面添加一个目标，再回来看看。</p>
    </section>

    <div class="widget-actions">
      <button class="btn btn-secondary widget-refresh" id="widgetRefreshButton" type="button">刷新</button>
    </div>
  </main>

  <script src="countdown_widget.js"></script>
</body>
</html>
