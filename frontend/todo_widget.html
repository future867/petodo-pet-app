<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日待办小组件</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      color-scheme: light;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      padding: 10px;
      overflow: hidden;
    }

    .todo-widget-shell {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 14px;
      border: 1px solid rgba(222, 220, 209, 0.92);
      border-radius: 24px;
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 255, 255, 0.98), rgba(255, 247, 239, 0.9) 46%, rgba(250, 249, 245, 0.92)),
        rgba(255, 254, 250, 0.92);
      box-shadow: none;
      backdrop-filter: blur(14px);
      -webkit-app-region: drag;
    }

    .todo-widget-toolbar,
    .todo-widget-list,
    .todo-widget-actions,
    .todo-widget-empty,
    .todo-widget-resize-handle {
      -webkit-app-region: no-drag;
    }

    .todo-widget-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex: 0 0 auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    .todo-widget-kicker,
    .todo-widget-title,
    .todo-widget-summary,
    .todo-widget-empty p {
      margin: 0;
    }

    .todo-widget-kicker {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .todo-widget-title {
      margin-top: 3px;
      font-size: 22px;
      line-height: 1.15;
    }

    .todo-widget-summary {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .todo-widget-close {
      display: inline-grid;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid rgba(222, 220, 209, 0.92);
      border-radius: 999px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.74);
      cursor: pointer;
    }

    .todo-widget-list {
      display: grid;
      gap: 8px;
      align-content: start;
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(217, 119, 87, 0.48) transparent;
    }

    .todo-widget-list:empty {
      display: none;
    }

    .todo-widget-list::-webkit-scrollbar {
      width: 6px;
    }

    .todo-widget-list::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(217, 119, 87, 0.38);
    }

    .todo-widget-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .todo-widget-item {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      padding: 8px 9px;
      border: 1px solid rgba(222, 220, 209, 0.86);
      border-radius: 14px;
      background: rgba(255, 254, 250, 0.78);
    }

    .todo-widget-item.is-completed {
      opacity: 0.58;
    }

    .todo-widget-item input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .todo-widget-name {
      overflow: hidden;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .todo-widget-item.is-completed .todo-widget-name {
      text-decoration: line-through;
    }

    .todo-widget-status {
      color: var(--text-muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .todo-widget-empty {
      display: grid;
      flex: 1 1 auto;
      place-items: center;
      min-height: 0;
      padding: 18px;
      border: 1px dashed rgba(222, 220, 209, 0.92);
      border-radius: 18px;
      background: rgba(243, 240, 232, 0.62);
      text-align: center;
    }

    .todo-widget-empty[hidden] {
      display: none;
    }

    .todo-widget-empty p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    .todo-widget-actions {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      flex: 0 0 auto;
      gap: 8px;
      margin-top: 12px;
      padding-right: 26px;
      padding-top: 12px;
    }

    .todo-widget-actions .btn {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    .todo-widget-resize-handle {
      position: absolute;
      right: 13px;
      bottom: 10px;
      z-index: 6;
      display: grid;
      width: 24px;
      height: 24px;
      padding: 0;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      color: rgba(39, 35, 31, 0.54);
      background: transparent;
      cursor: nwse-resize;
      opacity: 0.62;
      transition: opacity 130ms ease, transform 130ms ease, background 130ms ease;
      touch-action: none;
    }

    .todo-widget-shell:hover .todo-widget-resize-handle,
    .todo-widget-shell.is-resizing .todo-widget-resize-handle,
    .todo-widget-resize-handle:focus-visible {
      opacity: 1;
    }

    .todo-widget-resize-handle:hover {
      background: rgba(217, 119, 87, 0.1);
      transform: translateY(-1px);
    }

    .todo-widget-resize-handle:active {
      transform: translateY(1px) scale(0.98);
    }

    .todo-widget-resize-handle svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <main class="todo-widget-shell" aria-label="今日待办桌面小组件">
    <div class="todo-widget-toolbar">
      <div>
        <p class="todo-widget-kicker">Petodo</p>
        <h1 class="todo-widget-title">今日待办</h1>
        <p class="todo-widget-summary" id="todoWidgetSummary">正在读取待办...</p>
      </div>
      <button class="todo-widget-close" id="todoWidgetCloseButton" type="button" aria-label="关闭小组件">×</button>
    </div>

    <section class="todo-widget-list" id="todoWidgetList" aria-label="今日待办列表"></section>

    <section class="todo-widget-empty" id="todoWidgetEmpty" hidden>
      <p>今天还没有待办，给自己安排一个小目标吧。</p>
    </section>

    <div class="todo-widget-actions">
      <button class="btn btn-secondary" id="todoWidgetRefreshButton" type="button">刷新</button>
      <button class="btn btn-primary" id="todoWidgetOpenMainButton" type="button">打开主窗口</button>
    </div>

    <button class="todo-widget-resize-handle" id="todoWidgetResizeHandle" type="button" aria-label="拖动调整小组件大小">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M5 13h8V5"></path>
        <path d="M8 13l5-5"></path>
      </svg>
    </button>
  </main>

  <script src="todo_widget.js"></script>
</body>
</html>
